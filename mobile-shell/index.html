<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1d14" />
  <title>GeoWeedo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1d14; color: #f4f8f4; }
    main { width: min(32rem, calc(100% - 3rem)); text-align: center; padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom)); }
    img { width: min(18rem, 75vw); height: auto; }
    p { line-height: 1.55; opacity: .82; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1rem; border-radius: .75rem; background: #f4f8f4; color: #0f1d14; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="https://geoweedo.com/assets/geoweedo/geoweedo-logo-horizontal-dark.png" alt="GeoWeedo" />
    <h1>GeoWeedo</h1>
    <p>The app could not reach geoweedo.com. Check your internet connection and try again.</p>
    <a href="https://geoweedo.com">Try GeoWeedo again</a>
  </main>
</body>
</html>
