name: GeoWeedo iOS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-android-ios
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'mobile-shell/**'
      - 'scripts/mobile-bootstrap.sh'
      - 'scripts/mobile-configure-native.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'mobile-shell/**'
      - 'scripts/mobile-bootstrap.sh'
      - 'scripts/mobile-configure-native.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ios.yml'

permissions:
  contents: read

concurrency:
  group: geoweedo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "$XCODE_APP" ]]; then
            echo 'Xcode 26 is not installed on this GitHub runner.' >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap Capacitor iOS
        run: |
          chmod +x scripts/mobile-bootstrap.sh
          ./scripts/mobile-bootstrap.sh ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          node --version
          npm --version
          find ios/App -maxdepth 1 -type d -print

      - name: Build GeoWeedo for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate simulator app
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Build/Products/Debug-iphonesimulator/App.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo 'GeoWeedo simulator .app was not found' >&2
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/geoweedo-ios-simulator.zip
          shasum -a 256 artifacts/geoweedo-ios-simulator.zip > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload GeoWeedo iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoweedo-ios-simulator-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
