name: GeoWeedo Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: geoweedo-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test taxonomy and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test product taxonomy
        run: npm run test:product-taxonomy

      - name: Build GeoWeedo
        run: npm run build
