name: GeoWeedo Web CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: geoweedo-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test taxonomy and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test product taxonomy
        run: npm run test:product-taxonomy

      - name: Validate Cannlytics importers
        run: |
          python3 -m py_compile scripts/import-cannlytics-public.py scripts/import-cannlytics-resumable.py scripts/audit-cannlytics-duplicates.py scripts/reconcile-cannlytics-products.py scripts/reconcile-cannlytics-products-safe.py scripts/reconcile-cannlytics-products-v3.py scripts/enrich-cannlytics-owners.py
          node --check scripts/run-weedo-source-update.mjs

      - name: Build GeoWeedo
        run: npm run build
