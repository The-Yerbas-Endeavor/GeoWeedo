upstream geoweedo_backend {
    # Blue normally serves on 3000. Green is the hot deployment fallback on 3001.
    # During a deploy the inactive slot is started and health-checked before the
    # active slot is stopped, so nginx always has at least one healthy backend.
    server 127.0.0.1:3000 max_fails=1 fail_timeout=1s;
    server 127.0.0.1:3001 backup;
    keepalive 32;
}

